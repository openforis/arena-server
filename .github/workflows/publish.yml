name: 'Publish package'

# publishes the package to GitHub Packages and npmjs when a version tag is pushed (by release.yml).
# The two registries are published by independent jobs: if one fails, use "Re-run failed jobs".
# Every publish job is skipped when the version is already in its registry, so the whole workflow can be re-run too;
# it can also be started manually on an existing v* tag (Run workflow > Use workflow from: tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5444:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn test
        env:
          PGHOST: localhost
          PGPORT: 5444
          PGDATABASE: arena
          PGUSER: arena
          PGPASSWORD: arena

  publish-github-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn build
      # the registry (https://npm.pkg.github.com) comes from publishConfig in package.json
      - name: Publish to GitHub Packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sSf -H "Authorization: Bearer ${YARN_NPM_AUTH_TOKEN}" https://npm.pkg.github.com/@openforis%2farena-server \
            | jq -e --arg version "$VERSION" '.versions[$version]' > /dev/null; then
            echo "::notice::version $VERSION already published to GitHub Packages: skipped"
          else
            yarn npm publish
          fi
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  publish-npmjs:
    needs: test
    runs-on: ubuntu-latest
    # id-token: npm trusted publishing and provenance authenticate the workflow run with an OIDC token
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn build
      # drop the GitHub-specific registry config (publishConfig) before publishing.
      # --provenance links the published version to this workflow run and commit.
      # npm authenticates with the trusted publisher (OIDC) configured for this workflow file (publish.yml)
      # on npmjs.com, whose allowed actions must include "npm publish": no npm token is used.
      - name: Publish to npmjs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf -o /dev/null "https://registry.npmjs.org/@openforis%2farena-server/${VERSION}"; then
            echo "::notice::version $VERSION already published to npmjs: skipped"
            exit 0
          fi
          # the OIDC request variables are only set when the job has the id-token: write permission
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC token not available: the job did not get the id-token: write permission"
            exit 1
          fi
          npm pkg delete publishConfig
          # verbose logging shows the outcome of the OIDC token exchange with npmjs (trusted publisher match)
          npm publish --registry https://registry.npmjs.org/ --access public --provenance --loglevel verbose
