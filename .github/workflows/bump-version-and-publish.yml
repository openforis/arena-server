name: Arena Server - Bump Version and Publish to GitHub Packages and npmjs

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'package.json'

jobs:
  publish-new-version:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Temporarily disable "include administrators" branch protection
        uses: ./.github/actions/toggle-branch-protection
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          enforce_admins: 'false'
          branch: ${{ github.ref_name }}
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          tag-prefix: 'v'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --immutable
      - run: yarn build
      - name: Publish to GitHub Packages
        run: yarn npm publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      # npmjs: drop the GitHub-specific registry config (publishConfig) before publishing
      - name: Publish to npmjs
        run: |
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmjs.npmrc"
          npm publish --registry https://registry.npmjs.org/ --access public --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Enable "include administrators" branch protection
        if: always() # Force to always run this step to ensure "include administrators" is always turned back on
        uses: ./.github/actions/toggle-branch-protection
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          enforce_admins: 'true'
          branch: ${{ github.ref_name }}
